<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provenance Visualizer</title>
  <link rel="icon" type="image/x-icon" href="diamond-logo.ico">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div id="main-toolbar" class="toolbar">
      <div class="toolbar-left">
        <div class="toolbar-title-block">
          <h1>Provenance Visualizer</h1>
          <div id="toolbar-results-summary" class="toolbar-results-summary"></div>
        </div>

        <button id="object-detail-back" class="toolbar-btn secondary" type="button" style="display:none;">
          Back to comparison
        </button>

        <div id="object-detail-status" class="filter-summary" style="display:none;"></div>

        <div class="toolbar-controls-row">

          <div class="toolbar-control-group toolbar-control-group-filters">
            <button id="filters-toggle" class="toolbar-btn" type="button">
              Filters
              <span id="active-filter-count" class="toolbar-badge">0</span>
            </button>

            <button id="reset-filters" class="toolbar-btn secondary" type="button">
              Clear filters
            </button>
          </div>

          <div class="toolbar-control-group toolbar-control-group-view">
            <button id="reset-view" class="toolbar-btn secondary" type="button">
              Reset view
            </button>

            <button id="nav-help-btn" class="icon-btn help-btn" type="button" aria-label="Navigation help">i</button>
          </div>

          <div class="toolbar-control-group toolbar-control-group-view toolbar-control-group-time">
            <div class="toolbar-date-nav">
              <input
                id="timeline-date-start"
                class="toolbar-date-input"
                type="date"
                placeholder="YYYY-MM-DD"
                aria-label="Go to date or interval start date"
              />

              <button
                id="timeline-date-range-toggle"
                class="toolbar-date-toggle"
                type="button"
                aria-expanded="false"
                aria-label="Switch to date interval mode"
                title="Add end date"
              >
                →
              </button>

              <input
                id="timeline-date-end"
                class="toolbar-date-input hidden"
                type="date"
                placeholder="YYYY-MM-DD"
                aria-label="Interval end date"
              />

              <button
                id="timeline-date-apply"
                class="toolbar-btn secondary"
                type="button"
              >
                Go
              </button>
            </div>
          </div>

          <div class="toolbar-control-group toolbar-control-group-view toolbar-control-group-time">
            <div class="toolbar-date-nav">
              <input
                id="timeline-date-start"
                class="toolbar-date-input"
                type="text"
                placeholder="Search Object ID..."
                aria-label="Go to date or interval start date"
              />
            </div>
          </div>

        </div>

        <div id="filter-summary" class="filter-summary"></div>
      </div>
    </div>

    <div id="timeline-wrap">
      <div id="left-panel-html"></div>
      <svg id="timeline"></svg>

      <div id="event-card" class="event-card hidden" aria-live="polite">
        <div class="event-card-header">
          <div class="event-card-title-wrap">
            <div id="event-card-category" class="event-card-category">Event</div>
            <div id="event-card-object" class="event-card-object">Object</div>
          </div>

          <button id="event-card-close" class="event-card-close" type="button" aria-label="Close event details">
            ×
          </button>
        </div>

        <div id="event-card-body" class="event-card-body">
          <div class="event-card-empty">Click an event to inspect it.</div>
        </div>
      </div>
    </div>
  </div>

  <aside id="filters-panel" class="filters-panel">
    <div class="filters-panel-header">
      <div>
        <div class="filters-title">Filters</div>
        <!-- <div class="filters-results-summary" id="filters-results-summary">
          0/0 matching objects · 0/0 matching events
        </div> -->
        <!-- <div class="filters-subtitle">OR inside a group · AND across groups</div> -->
      </div>
      <button id="filters-close" class="icon-btn" type="button">✕</button>
    </div>

    <div class="filters-section">
      <div class="section-title">Mode</div>
      <div class="mode-list">
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="focus" checked />
          <span>Focus</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="collapsed" />
          <span>Collapsed</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="regular" />
          <span>Regular</span>
        </label>
      </div>
    </div>

    <div class="filters-scroll">
      <section class="filters-section">
        <div class="section-title">
          <span>Category</span>
          <span class="section-title-count" id="count-category">0</span>
        </div>

        <div class="filter-combobox">
          <input
            class="filter-search"
            id="search-category"
            type="text"
            placeholder="Search and select..."
            autocomplete="off"
          />

          <button
            class="filter-clear-btn"
            id="clear-category"
            type="button"
            aria-label="Clear event type filter"
          >
            ×
          </button>

          <div class="filter-popup" id="popup-category">
            <div class="filter-list" id="list-category"></div>
          </div>
        </div>
      </section>

      <section class="filters-section">
  <div class="section-title">
          <span>Institution</span>
          <span class="section-title-count" id="count-institution">0</span>
        </div>

        <div class="filter-combobox">
          <input
            class="filter-search"
            id="search-institution"
            type="text"
            placeholder="Search and select..."
            autocomplete="off"
          />

          <button
            class="filter-clear-btn"
            id="clear-institution"
            type="button"
            aria-label="Clear institution filter"
          >
            ×
          </button>

          <div class="filter-popup" id="popup-institution">
            <div class="filter-list" id="list-institution"></div>
          </div>
        </div>
      </section>

      <section class="filters-section">
        <div class="section-title">
          <span>EDO designation</span>
          <span class="section-title-count" id="count-edo">0</span>
        </div>

        <div class="filter-combobox">
          <input
            class="filter-search"
            id="search-edo"
            type="text"
            placeholder="Search and select..."
            autocomplete="off"
          />

          <button
            class="filter-clear-btn"
            id="clear-edo"
            type="button"
            aria-label="Clear EDO designation filter"
          >
            ×
          </button>

          <div class="filter-popup" id="popup-edo">
            <div class="filter-list" id="list-edo"></div>
          </div>
        </div>
      </section>

      <section class="filters-section">
          <div class="section-title">
            <span>Actor</span>
            <span class="section-title-count" id="count-actor">0</span>
          </div>

          <div class="filter-combobox">
            <input
              class="filter-search"
              id="search-actor"
              type="text"
              placeholder="Search and select..."
              autocomplete="off"
            />

            <button
              class="filter-clear-btn"
              id="clear-actor"
              type="button"
              aria-label="Clear actor filter"
            >
              ×
            </button>

            <div class="filter-popup" id="popup-actor">
              <div class="filter-list" id="list-actor"></div>
            </div>
          </div>
        </section>

      <section class="filters-section">
        <div class="section-title">
          <span>Start city</span>
          <span class="section-title-count" id="count-cityStart">0</span>
        </div>

        <div class="filter-combobox">
          <input
            class="filter-search"
            id="search-city-start"
            type="text"
            placeholder="Search and select..."
            autocomplete="off"
          />

          <button
            class="filter-clear-btn"
            id="clear-cityStart"
            type="button"
            aria-label="Clear start city filter"
          >
            ×
          </button>

          <div class="filter-popup" id="popup-city-start">
            <div class="filter-list" id="list-city-start"></div>
          </div>
        </div>
      </section>

      <section class="filters-section">
        <div class="section-title">
          <span>End city</span>
          <span class="section-title-count" id="count-cityEnd">0</span>
        </div>

        <div class="filter-combobox">
          <input
            class="filter-search"
            id="search-city-end"
            type="text"
            placeholder="Search and select..."
            autocomplete="off"
          />

          <button
            class="filter-clear-btn"
            id="clear-cityEnd"
            type="button"
            aria-label="Clear end city filter"
          >
            ×
          </button>

          <div class="filter-popup" id="popup-city-end">
            <div class="filter-list" id="list-city-end"></div>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <div id="filters-overlay" class="filters-overlay"></div>

  <div id="nav-help-tooltip" class="toolbar-tooltip">
    <div>Scroll = horizontal or vertical navigation</div>
    <div>Scroll vertical + Ctrl = zoom</div>
    <div>Scroll vertical + Shift = resize matched events</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="script.js"></script>
</body>
</html>
